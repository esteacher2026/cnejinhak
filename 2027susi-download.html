    @media (max-width: 980px) {

    @media (max-width: 640px) {

  <script src="2027susi-download-data.js"></script>
  <script>
    (function () {
      'use strict';

      var raw = Array.isArray(window.SUSI_GUIDES_2027) ? window.SUSI_GUIDES_2027 : [];
      var state = { query: '', region: '', schoolType: '', fileType: '', quickType: 'all', sort: 'university' };
      var nf = new Intl.NumberFormat('ko-KR');
      var regionOrder = ['서울', '경기·인천', '강원', '충청', '영남', '호남·제주', '교육대', '이공계특성화', '특수대학'];
      var typeOrder = { '일반대': 1, '교육대': 2, '이공계특성화': 3, '특수대학': 4 };

      function $(id) { return document.getElementById(id); }
      function clean(text) {
        return String(text == null ? '' : text).replace(/\+/g, ' ').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
      }
      function cleanId(text) {
        return String(text == null ? '' : text).replace(/\s+/g, '').trim();
      }
      function esc(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function norm(text) {
        return clean(text).toLowerCase().replace(/\s+/g, '');
      }
      function unique(list) {
        return Array.from(new Set(list)).filter(Boolean).sort(function (a, b) {
          var ai = regionOrder.indexOf(a);
          var bi = regionOrder.indexOf(b);
          if (ai !== -1 || bi !== -1) return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
          return a.localeCompare(b, 'ko');
        });
      }
      function highlight(text, terms) {
        var safe = esc(text);
        terms.filter(function (t) { return t.length >= 2; }).slice(0, 5).forEach(function (term) {
          var pattern = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          safe = safe.replace(new RegExp(pattern, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
        });
        return safe;
      }
      function previewUrl(id) {
        return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view?usp=sharing';
      }
      function downloadUrl(id) {
        return 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id);
      }

      var seen = new Set();
      var files = raw.map(function (item, idx) {
        var id = cleanId(item.id);
        var title = clean(item.title);
        var type = clean(item.type || title.split('.').pop()).toUpperCase();
        var university = clean(item.university);
        var region = clean(item.region || '기타');
        var schoolType = clean(item.schoolType || '일반대');
        return {
          id: id,
          index: idx,
          title: title,
          type: type,
          university: university,
          region: region,
          schoolType: schoolType,
          search: norm([university, region, schoolType, title, type].join(' '))
        };
      }).filter(function (item) {
        if (!item.id || !item.title || !item.university) return false;
        if (seen.has(item.id)) return false;
        seen.add(item.id);
        return true;
      });

      function populateFilters() {
        $('region').innerHTML = ['<option value="">전체 지역</option>'].concat(unique(files.map(function (f) { return f.region; })).map(function (r) {
          return '<option value="' + esc(r) + '">' + esc(r) + '</option>';
        })).join('');

        $('schoolType').innerHTML = ['<option value="">전체 분류</option>'].concat(unique(files.map(function (f) { return f.schoolType; })).sort(function (a, b) {
          return (typeOrder[a] || 99) - (typeOrder[b] || 99) || a.localeCompare(b, 'ko');
        }).map(function (t) {
          return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
        })).join('');

        $('fileType').innerHTML = ['<option value="">전체 형식</option>'].concat(unique(files.map(function (f) { return f.type; })).map(function (t) {
          return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
        })).join('');
      }
      function renderStats() {
        var universityCount = unique(files.map(function (f) { return f.university; })).length;
        var pdfCount = files.filter(function (f) { return f.type === 'PDF'; }).length;
        var hwpCount = files.filter(function (f) { return f.type === 'HWP'; }).length;
        $('statGrid').innerHTML = [
          ['대학·기관', universityCount + '개'],
          ['자료', files.length + '개'],
          ['PDF', pdfCount + '개'],
          ['HWP', hwpCount + '개']
        ].map(function (s) {
          return '<div class="stat"><span>' + esc(s[0]) + '</span><b>' + esc(s[1]) + '</b></div>';
        }).join('');
      }
      function filteredFiles() {
        var q = norm(state.query);
        return files.filter(function (f) {
          if (state.region && f.region !== state.region) return false;
          if (state.schoolType && f.schoolType !== state.schoolType) return false;
          if (state.quickType !== 'all' && f.schoolType !== state.quickType) return false;
          if (state.fileType && f.type !== state.fileType) return false;
          if (q && f.search.indexOf(q) === -1) return false;
          return true;
        });
      }
      function groupByUniversity(items) {
        var map = new Map();
        items.forEach(function (f) {
          if (!map.has(f.university)) map.set(f.university, []);
          map.get(f.university).push(f);
        });
        var groups = Array.from(map.entries()).map(function (entry) {
          var list = entry[1].sort(function (a, b) {
            return a.title.localeCompare(b.title, 'ko') || a.index - b.index;
          });
          return {
            university: entry[0],
            files: list,
            regions: unique(list.map(function (f) { return f.region; })),
            types: unique(list.map(function (f) { return f.type; })),
            schoolTypes: unique(list.map(function (f) { return f.schoolType; }))
          };
        });
        groups.sort(function (a, b) {
          if (state.sort === 'count') return b.files.length - a.files.length || a.university.localeCompare(b.university, 'ko');
          if (state.sort === 'region') return a.regions.join(',').localeCompare(b.regions.join(','), 'ko') || a.university.localeCompare(b.university, 'ko');
          return a.university.localeCompare(b.university, 'ko');
        });
        return groups;
      }
      function render() {
        var terms = clean(state.query).split(/\s+/).filter(Boolean);
        var matched = filteredFiles();
        var groups = groupByUniversity(matched);
        $('resultSummary').textContent = nf.format(groups.length) + '개 대학·기관 · ' + nf.format(matched.length) + '개 자료 표시';

        if (!groups.length) {
          $('results').innerHTML = '<div class="empty"><strong>검색 결과가 없습니다.</strong><br>검색어를 줄이거나 필터를 초기화해 보세요.</div>';
          return;
        }

        $('results').innerHTML = groups.map(function (group) {
          var badges = []
            .concat(group.regions.map(function (r) { return '<span class="badge">' + esc(r) + '</span>'; }))
            .concat(group.schoolTypes.map(function (t) { return '<span class="badge">' + esc(t) + '</span>'; }))
            .concat(group.types.map(function (t) { return '<span class="badge type-' + esc(t.toLowerCase()) + '">' + esc(t) + '</span>'; }))
            .concat(['<span class="badge">' + nf.format(group.files.length) + '개 자료</span>'])
            .join('');
          var rows = group.files.map(function (file) {
            return [
              '<div class="file-row">',
              '  <div class="file-title">' + highlight(file.title, terms) + '</div>',
              '  <div class="file-actions">',
              '    <a class="btn small" href="' + previewUrl(file.id) + '" target="_blank" rel="noopener">미리보기</a>',
              '    <a class="btn small green" href="' + downloadUrl(file.id) + '" target="_blank" rel="noopener">다운로드</a>',
              '  </div>',
              '</div>'
            ].join('');
          }).join('');
          return [
            '<article class="uni-card">',
            '  <div class="uni-head">',
            '    <h3 class="uni-title">' + highlight(group.university, terms) + '</h3>',
            '    <div class="uni-meta">' + badges + '</div>',
            '  </div>',
            '  <div class="file-list">' + rows + '</div>',
            '</article>'
          ].join('');
        }).join('');
      }
      function bind() {
        $('q').addEventListener('input', function (e) { state.query = e.target.value; render(); });
        $('region').addEventListener('change', function (e) { state.region = e.target.value; render(); });
        $('schoolType').addEventListener('change', function (e) { state.schoolType = e.target.value; render(); });
        $('fileType').addEventListener('change', function (e) { state.fileType = e.target.value; render(); });
        $('sort').addEventListener('change', function (e) { state.sort = e.target.value; render(); });

        document.querySelectorAll('#typeChips .chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            state.quickType = chip.dataset.type;
            document.querySelectorAll('#typeChips .chip').forEach(function (item) {
              item.setAttribute('aria-pressed', item === chip ? 'true' : 'false');
            });
            render();
          });
        });

        $('resetBtn').addEventListener('click', function () {
          state = { query: '', region: '', schoolType: '', fileType: '', quickType: 'all', sort: 'university' };
          $('q').value = '';
          $('region').value = '';
          $('schoolType').value = '';
          $('fileType').value = '';
          $('sort').value = 'university';
          document.querySelectorAll('#typeChips .chip').forEach(function (chip) {
            chip.setAttribute('aria-pressed', chip.dataset.type === 'all' ? 'true' : 'false');
          });
          render();
          $('q').focus();
        });
      }

      populateFilters();
      renderStats();
      bind();
      render();
    })();
  </script>
</body>
</html>
