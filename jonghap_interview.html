<!doctype html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0VB6E0J6MB"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>학생부종합전형 면접평가 비교</title>
  <script src="jonghap_interview_data.js"></script>
  <style>
    :root{
      --bg:#f4f6f8;--surface:#fff;--ink:#111827;--muted:#667085;--line:#d9e0e8;
      --navy:#123247;--navy2:#0f2534;--teal:#0f766e;--teal-soft:#d9f3ef;
      --blue:#2563eb;--blue-soft:#e8f0ff;--amber:#b45309;--amber-soft:#fff4d8;
      --red:#b42318;--red-soft:#fee4e2;--green:#15803d;--green-soft:#dcfce7;
      --violet:#7c3aed;--violet-soft:#ede9fe;--shadow:0 14px 32px rgba(15,23,42,.08);
      --radius:8px;--safe-bottom:env(safe-area-inset-bottom,0px);
      --bar1:#2563eb;--bar2:#0f766e;--bar3:#b45309;--bar4:#7c3aed;--bar5:#475467;--bar6:#0e7490;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{width:min(1440px,100%);margin:0 auto;padding:16px 16px calc(36px + var(--safe-bottom))}
    .topbar{display:flex;align-items:center;margin-bottom:12px}
    .home{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border:1px solid #b9c8d8;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-size:13px;font-weight:900}
    .home svg,.icon{width:16px;height:16px;flex:0 0 16px}
    header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:22px 24px;border-radius:var(--radius);background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;box-shadow:var(--shadow)}
    .eyebrow{margin:0 0 6px;color:#b6d3dd;font-size:12px;font-weight:900;letter-spacing:0}
    h1{margin:0;font-size:clamp(26px,4vw,42px);line-height:1.1;letter-spacing:0}
    header p{margin:10px 0 0;max-width:900px;color:#d6e4ea;font-size:14px;word-break:keep-all}
    .meta-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .meta-pill{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:850;color:#fff}
    .summary-box{min-width:260px;padding:14px;border:1px solid rgba(255,255,255,.18);border-radius:var(--radius);background:rgba(255,255,255,.08)}
    .summary-box b{display:block;font-size:22px;line-height:1.1}
    .summary-box span{display:block;margin-top:5px;color:#c9d8de;font-size:12px;font-weight:750}
    .workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
    .panel{min-width:0;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 24px rgba(15,23,42,.05)}
    .controls{position:sticky;top:10px;z-index:10;padding:14px}
    .field{display:grid;gap:6px;margin-bottom:10px}
    .field label{color:#344054;font-size:12px;font-weight:900}
    input[type="search"],select{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:var(--radius);background:#fff;padding:0 11px;color:#111827;outline:none}
    input[type="search"]:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
    .checks{display:grid;gap:8px;margin-top:10px}
    .check{display:flex;align-items:center;gap:8px;min-height:38px;padding:8px 9px;border:1px solid #e2e8f0;border-radius:var(--radius);background:#f8fafc;color:#344054;font-size:12.5px;font-weight:850}
    .check input{width:18px;height:18px;accent-color:var(--teal)}
    .filter-actions{display:flex;gap:8px;margin-top:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 12px;border:1px solid transparent;border-radius:var(--radius);background:var(--navy);color:#fff;font-size:12.5px;font-weight:900}
    .btn.secondary{background:#fff;color:#344054;border-color:#cbd5e1}
    .btn.teal{background:var(--teal)}
    .btn.warn{background:#fff;color:#92400e;border-color:#f3c36b}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
    .stat{padding:9px;border:1px solid #e4eaf1;border-radius:var(--radius);background:#f8fafc}
    .stat span{display:block;color:#667085;font-size:11px;font-weight:850}
    .stat b{display:block;margin-top:2px;font-size:19px;font-variant-numeric:tabular-nums}
    .compare-tray{margin-top:12px;padding:12px;border:1px solid #c7e8e2;border-radius:var(--radius);background:#f2fbf9}
    .tray-title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
    .tray-title b{font-size:13px}
    .compare-tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:28px;padding:4px 8px;border-radius:999px;background:#fff;border:1px solid #cbd5e1;color:#344054;font-size:12px;font-weight:800}
    .tag button{border:0;background:transparent;color:#667085;padding:0;line-height:1;font-size:16px}
    .main{display:grid;gap:12px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
    .toolbar h2{margin:0;font-size:17px;letter-spacing:0}
    .toolbar p{margin:2px 0 0;color:#667085;font-size:12px}
    .list{display:grid;gap:8px;padding:0 12px 12px;max-height:540px;overflow:auto}
    .uni-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px;border:1px solid #e4eaf1;border-radius:var(--radius);background:#fff;text-align:left}
    .uni-row.active{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.10)}
    .uni-row:hover{border-color:#b6c5d6}
    .uni-main{display:block;width:100%;border:0;background:transparent;color:inherit;padding:0;text-align:left}
    .uni-name{font-size:14.5px;font-weight:900;letter-spacing:0;word-break:keep-all}
    .uni-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
    .badge{display:inline-flex;align-items:center;min-height:22px;padding:3px 7px;border-radius:999px;background:#f1f5f9;color:#475467;font-size:11px;font-weight:850}
    .badge.good{background:var(--green-soft);color:#166534}.badge.teal{background:var(--teal-soft);color:#115e59}.badge.blue{background:var(--blue-soft);color:#1d4ed8}.badge.warn{background:var(--amber-soft);color:#92400e}.badge.red{background:var(--red-soft);color:#991b1b}.badge.violet{background:var(--violet-soft);color:#5b21b6}
    .row-actions{display:flex;gap:6px}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid #cbd5e1;border-radius:var(--radius);background:#fff;color:#344054}
    .icon-btn.active{background:var(--teal);border-color:var(--teal);color:#fff}
    .detail{padding:16px}
    .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .detail h2{margin:0;font-size:22px;letter-spacing:0;word-break:keep-all}
    .detail-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .empty{padding:28px 18px;text-align:center;color:#667085}
    .empty b{display:block;color:#111827;font-size:16px;margin-bottom:5px}
    .section-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
    .kpi{padding:12px;border:1px solid #e4eaf1;border-radius:var(--radius);background:#fbfcfe}
    .kpi span{display:block;color:#667085;font-size:11.5px;font-weight:900}
    .kpi b{display:block;margin-top:4px;font-size:16px;line-height:1.25;word-break:keep-all}
    .block{margin-top:14px}
    .block-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
    .block-title h3{margin:0;font-size:16px}
    .block-title span{color:#667085;font-size:12px;font-weight:750}
    .interview-list{display:grid;gap:10px}
    .interview-card{padding:12px;border:1px solid #e4eaf1;border-radius:var(--radius);background:#fff}
    .interview-card.special{background:#fffaf0;border-color:#f4cf8e}
    .interview-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
    .interview-title b{font-size:14px;word-break:keep-all}
    .fact-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
    .fact{min-width:0;border-left:3px solid #d7e1eb;padding-left:8px}
    .fact span{display:block;color:#667085;font-size:11px;font-weight:900}
    .fact b{display:block;margin-top:2px;color:#1f2937;font-size:12.5px;line-height:1.35;word-break:keep-all}
    .ratio-list{display:grid;gap:8px}
    .stack{height:28px;display:flex;overflow:hidden;border-radius:6px;background:#eef2f7;border:1px solid #e4eaf1}
    .seg{display:flex;align-items:center;justify-content:center;min-width:32px;color:#fff;font-size:11px;font-weight:900;white-space:nowrap}
    .legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .legend-item{display:inline-flex;align-items:center;gap:5px;color:#475467;font-size:11.5px;font-weight:800}
    .swatch{width:10px;height:10px;border-radius:3px;background:#667085}
    details.fold{margin-top:9px;border:1px solid #e4eaf1;border-radius:var(--radius);background:#fbfcfe}
    details.fold summary{padding:10px 11px;cursor:pointer;font-size:12.5px;font-weight:900;color:#344054}
    .fold-body{padding:0 11px 11px;white-space:pre-wrap;color:#344054;font-size:12.5px;max-height:320px;overflow:auto}
    .table-wrap{overflow:auto;border:1px solid #e4eaf1;border-radius:var(--radius);background:#fff}
    table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
    th,td{padding:8px 9px;border-bottom:1px solid #edf1f5;border-right:1px solid #edf1f5;text-align:left;vertical-align:top}
    th{background:#f1f5f9;color:#344054;font-weight:900}
    td{color:#1f2937}
    tr.special-row td{background:#fffaf0}
    .text-box{max-height:360px;overflow:auto;padding:12px;border:1px solid #e4eaf1;border-radius:var(--radius);background:#fff;white-space:pre-wrap;color:#344054;font-size:12.5px}
    .compare-panel{padding:16px}
    .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
    .compare-card{border:1px solid #e4eaf1;border-radius:var(--radius);background:#fff;padding:12px}
    .compare-card h3{margin:0 0 8px;font-size:16px;word-break:keep-all}
    .factor-list{display:grid;gap:6px;margin-top:8px}
    .factor-row{display:grid;grid-template-columns:96px 1fr 54px;gap:8px;align-items:center;font-size:12px;color:#344054}
    .mini-bar{height:8px;border-radius:999px;background:#e4eaf1;overflow:hidden}
    .mini-bar i{display:block;height:100%;background:var(--teal)}
    .note{margin:10px 0 0;padding:10px;border-radius:var(--radius);background:#f8fafc;border:1px solid #e4eaf1;color:#475467;font-size:12px;word-break:keep-all}
    .footer-credit{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:14px;padding:15px 18px;border-top:1px solid #cfd8e3;color:#475467}
    .credit-label{display:block;margin-bottom:3px;color:#667085;font-size:11px;font-weight:900}
    .credit-main{margin:0;color:#123247;font-size:13px;font-weight:850;word-break:keep-all}
    .credit-main b{font-weight:950}
    .credit-source{margin:0;color:#667085;font-size:12px;font-weight:850;white-space:nowrap}
    .toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translateX(-50%) translateY(16px);opacity:0;z-index:100;pointer-events:none;padding:10px 14px;border-radius:999px;background:#111827;color:#fff;box-shadow:var(--shadow);transition:opacity .18s,transform .18s;font-size:12.5px;font-weight:850}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:980px){
      header{grid-template-columns:1fr}.summary-box{min-width:0}
      .workspace{grid-template-columns:1fr}.controls{position:static}.list{max-height:none}
      .section-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .fact-list{grid-template-columns:1fr}
    }
    @media(max-width:640px){
      .app{padding:10px 8px calc(26px + var(--safe-bottom))}
      header{padding:18px 16px}.footer-credit{display:grid;gap:8px;padding:13px 8px}.credit-source{white-space:normal}
      .meta-strip{display:grid;grid-template-columns:minmax(0,1fr)}
      .meta-pill{justify-content:center;min-width:0;text-align:center;white-space:normal;line-height:1.2}
      .summary-box{width:100%}
      .toolbar,.detail-head{flex-direction:column;align-items:stretch}
      .section-grid{grid-template-columns:1fr}
      .uni-row{grid-template-columns:1fr}.row-actions{justify-content:flex-end}
      .filter-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
      .filter-actions .btn{width:100%;min-width:0;padding-left:8px;padding-right:8px}
      .status,.compare-tray{min-width:0}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="home" href="index.html" aria-label="메인으로 이동">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>
        메인
      </a>
    </div>

    <header>
      <div>
        <p class="eyebrow">2027학생부종합전형</p>
        <h1>면접평가 기준 비교</h1>
        <p>대학별 면접 진행방법, 면접시간, 출제방식, 평가요소와 문항 예시를 원문 기준으로 정리했습니다.</p>
        <div class="meta-strip">
          <span class="meta-pill" id="metaUniversities">전체 대학 -</span>
          <span class="meta-pill" id="metaSections">면접평가 확인 -</span>
          <span class="meta-pill" id="metaSummary">요약 행 -</span>
          <span class="meta-pill" id="metaFactors">평가요소 -</span>
        </div>
      </div>
      <div class="summary-box">
        <b>면접 준비용</b>
        <span>학생부종합전형 주요사항 중 [면접평가] 구간을 비교형 자료로 정리했습니다.</span>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel controls" aria-label="검색과 필터">
        <div class="field">
          <label for="q">대학명·면접 키워드 검색</label>
          <input id="q" type="search" placeholder="예: 서울, 개별면접, 10분, 학업역량" autocomplete="off" />
        </div>
        <div class="field">
          <label for="region">지역</label>
          <select id="region"></select>
        </div>
        <div class="field">
          <label for="statusFilter">면접 상태</label>
          <select id="statusFilter"></select>
        </div>
        <div class="field">
          <label for="method">면접 방식</label>
          <select id="method"></select>
        </div>
        <div class="field">
          <label for="factor">평가요소</label>
          <select id="factor"></select>
        </div>
        <div class="checks">
          <label class="check"><input id="onlyData" type="checkbox" checked /> 면접평가 구간 있는 대학만</label>
          <label class="check"><input id="hideSpecial" type="checkbox" checked /> 특별전형 행 기본 숨김</label>
        </div>
        <div class="filter-actions">
          <button class="btn secondary" id="resetBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
            초기화
          </button>
          <button class="btn teal" id="compareJump" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
            비교
          </button>
        </div>
        <div class="status">
          <div class="stat"><span>검색 결과</span><b id="resultCount">-</b></div>
          <div class="stat"><span>선택 비교</span><b id="compareCount">0</b></div>
        </div>
        <div class="compare-tray">
          <div class="tray-title"><b>비교 대학</b><button class="btn secondary" id="clearCompare" type="button">비우기</button></div>
          <div class="compare-tags" id="compareTags"></div>
        </div>
      </aside>

      <section class="main">
        <section class="panel">
          <div class="toolbar">
            <div>
              <h2>대학 목록</h2>
              <p id="listNote">자료를 불러오는 중입니다.</p>
            </div>
            <select id="sort">
              <option value="name">대학명순</option>
              <option value="status">면접 상태순</option>
              <option value="region">지역순</option>
              <option value="recruitment">종합 모집인원순</option>
            </select>
          </div>
          <div class="list" id="list"></div>
        </section>

        <section class="panel detail" id="detail"></section>

        <section class="panel compare-panel" id="comparePanel">
          <div class="block-title">
            <h3>대학 비교</h3>
            <span>선택한 대학 기준</span>
          </div>
          <div id="compareBody"></div>
        </section>
      </section>
    </main>
    <footer class="footer-credit">
      <div>
        <span class="credit-label">제작:</span>
        <p class="credit-main"><b>충청남도교육청진로융합교육원</b> 교육연구사 정재연</p>
      </div>
      <p class="credit-source">출처: 대입정보포털(adiga)</p>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const DATA = window.JONGHAP_INTERVIEW_EVAL_DATA;
    const state = { q:"", region:"", status:"", method:"", factor:"", onlyData:true, hideSpecial:true, sort:"name", selected:null, compare:[] };
    const statusRank = {"면접 실시":1,"부분 실시":2,"면접 없음":3,"구간 없음":4};
    const colorMap = {"학업역량":"#2563eb","진로·전공역량":"#0f766e","인성·공동체":"#b45309","의사소통":"#7c3aed","적성·창의":"#0e7490","기타":"#475467"};
    const els = {};

    function $(id){ return document.getElementById(id); }
    function esc(value){
      return String(value ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function short(value, limit=54){
      const text = String(value || "").trim();
      return text.length > limit ? `${text.slice(0, limit - 1)}…` : text;
    }
    function codeLabel(code){ return String(code).padStart(7,"0"); }
    function toast(message){
      const el = $("toast"); el.textContent = message; el.classList.add("show");
      clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("show"), 1700);
    }
    function statusClass(status){
      if(status === "면접 실시") return "good";
      if(status === "부분 실시") return "warn";
      if(status === "면접 없음") return "red";
      return "";
    }
    function visibleSummaries(uni){
      const rows = uni.summaries || [];
      return state.hideSpecial ? rows.filter(row => !row.special) : rows;
    }
    function visibleFactors(uni, summary){
      let rows = uni.factors || [];
      if(state.hideSpecial) rows = rows.filter(row => !row.special);
      if(summary){
        const same = rows.filter(row => String(row.tableNo) === String(summary.tableNo) && row.admission === summary.admission);
        if(same.length) return same;
        const sameTable = rows.filter(row => String(row.tableNo) === String(summary.tableNo));
        if(sameTable.length) return sameTable;
      }
      return rows;
    }
    function visibleTables(uni){
      return (uni.tables || []).map(table => ({
        ...table,
        rows: state.hideSpecial ? table.rows.filter(row => !row.special) : table.rows
      })).filter(table => table.rows.length);
    }
    function hasFactor(uni, factor){
      if(!factor) return true;
      return (uni.factors || []).some(row => row.name === factor || row.standard === factor) || uni.searchText.includes(factor);
    }
    function hasMethod(uni, method){
      if(!method) return true;
      const text = `${uni.primaryProcess || ""} ${uni.primarySource || ""} ${(uni.summaries || []).map(row => `${row.process} ${row.source}`).join(" ")}`;
      if(method === "다대다/그룹") return /다대다|그룹|집단/.test(text);
      if(method === "서류기반") return /서류|학교생활기록부|학생부/.test(text);
      return text.includes(method.replace("/그룹", ""));
    }
    function filtered(){
      const q = state.q.trim().toLowerCase();
      let rows = DATA.universities.filter(uni => {
        if(state.onlyData && !uni.hasSection) return false;
        if(state.region && uni.region !== state.region) return false;
        if(state.status && uni.status !== state.status) return false;
        if(state.method && !hasMethod(uni, state.method)) return false;
        if(state.factor && !hasFactor(uni, state.factor)) return false;
        if(q && !uni.searchText.toLowerCase().includes(q) && !uni.name.toLowerCase().includes(q)) return false;
        return true;
      });
      rows.sort((a,b) => {
        if(state.sort === "status") return (statusRank[a.status] || 9) - (statusRank[b.status] || 9) || a.name.localeCompare(b.name, "ko");
        if(state.sort === "region") return (a.region || "").localeCompare(b.region || "", "ko") || a.name.localeCompare(b.name, "ko");
        if(state.sort === "recruitment") return (Number(b.recruitment) || 0) - (Number(a.recruitment) || 0) || a.name.localeCompare(b.name, "ko");
        return a.name.localeCompare(b.name, "ko");
      });
      return rows;
    }
    function init(){
      if(!DATA){ document.body.innerHTML = "<p>데이터 파일을 불러오지 못했습니다.</p>"; return; }
      ["q","region","statusFilter","method","factor","onlyData","hideSpecial","sort"].forEach(id => els[id] = $(id));
      $("metaUniversities").textContent = `전체 대학 ${DATA.meta.universities.toLocaleString()}개`;
      $("metaSections").textContent = `면접평가 확인 ${DATA.meta.hasSection.toLocaleString()}개`;
      $("metaSummary").textContent = `요약 ${DATA.meta.summaryRows.toLocaleString()}행`;
      $("metaFactors").textContent = `평가요소 ${DATA.meta.factorRows.toLocaleString()}행`;
      els.region.innerHTML = `<option value="">전체 지역</option>` + DATA.regions.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
      els.statusFilter.innerHTML = `<option value="">전체 상태</option>` + DATA.statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      els.method.innerHTML = `<option value="">전체 방식</option>` + DATA.methods.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
      els.factor.innerHTML = `<option value="">전체 평가요소</option>` + DATA.factorFilters.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
      const first = DATA.universities.find(u => u.hasSection && u.status !== "구간 없음") || DATA.universities[0];
      state.selected = first ? first.code : null;
      bind();
      render();
    }
    function bind(){
      els.q.addEventListener("input", e => { state.q = e.target.value; renderList(); });
      els.region.addEventListener("change", e => { state.region = e.target.value; renderList(); });
      els.statusFilter.addEventListener("change", e => { state.status = e.target.value; renderList(); });
      els.method.addEventListener("change", e => { state.method = e.target.value; renderList(); });
      els.factor.addEventListener("change", e => { state.factor = e.target.value; renderList(); });
      els.onlyData.addEventListener("change", e => { state.onlyData = e.target.checked; renderList(); });
      els.hideSpecial.addEventListener("change", e => { state.hideSpecial = e.target.checked; renderDetail(); renderCompare(); renderList(); });
      els.sort.addEventListener("change", e => { state.sort = e.target.value; renderList(); });
      $("resetBtn").addEventListener("click", () => {
        Object.assign(state, { q:"", region:"", status:"", method:"", factor:"", onlyData:true, hideSpecial:true, sort:"name" });
        els.q.value = ""; els.region.value = ""; els.statusFilter.value = ""; els.method.value = ""; els.factor.value = "";
        els.onlyData.checked = true; els.hideSpecial.checked = true; els.sort.value = "name";
        render();
      });
      $("clearCompare").addEventListener("click", () => { state.compare = []; renderCompare(); renderList(); });
      $("compareJump").addEventListener("click", () => $("comparePanel").scrollIntoView({behavior:"smooth", block:"start"}));
    }
    function render(){ renderList(); renderDetail(); renderCompare(); }
    function renderList(){
      const rows = filtered();
      $("resultCount").textContent = rows.length.toLocaleString();
      const statusText = state.status || "전체 상태";
      $("listNote").textContent = `${DATA.meta.sourceYear}학년도 기준 · ${statusText}`;
      const list = $("list");
      if(!rows.length){
        list.innerHTML = `<div class="empty"><b>검색 결과가 없습니다.</b><span>검색어와 필터를 조정해 주세요.</span></div>`;
        return;
      }
      list.innerHTML = rows.map(uni => rowHtml(uni)).join("");
      list.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => { state.selected = btn.dataset.open; renderList(); renderDetail(); }));
      list.querySelectorAll("[data-compare]").forEach(btn => btn.addEventListener("click", e => { e.stopPropagation(); toggleCompare(btn.dataset.compare); }));
    }
    function rowHtml(uni){
      const selected = uni.code === state.selected;
      const compared = state.compare.includes(uni.code);
      const top = uni.topFactors && uni.topFactors[0] ? `${uni.topFactors[0].name} ${uni.topFactors[0].raw}` : (uni.primaryTime || "원문 확인");
      return `
        <article class="uni-row ${selected ? "active" : ""}">
          <button class="uni-main" data-open="${esc(uni.code)}" type="button">
            <div>
              <div class="uni-name">${esc(uni.name)}</div>
              <div class="uni-meta">
                <span class="badge">${esc(uni.region || "-")}</span>
                <span class="badge ${statusClass(uni.status)}">${esc(uni.status)}</span>
                <span class="badge blue">${esc(short(uni.primaryTime || "-", 24))}</span>
                <span class="badge teal">${esc(short(uni.primaryProcess || "-", 28))}</span>
                <span class="badge violet">${esc(short(top, 28))}</span>
              </div>
            </div>
          </button>
          <div class="row-actions">
            <button class="icon-btn ${compared ? "active" : ""}" data-compare="${esc(uni.code)}" type="button" aria-label="비교 선택">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
            </button>
          </div>
        </article>`;
    }
    function currentUni(){ return DATA.universities.find(uni => uni.code === state.selected) || DATA.universities[0]; }
    function renderDetail(){
      const uni = currentUni();
      if(!uni){ $("detail").innerHTML = `<div class="empty"><b>대학을 선택해 주세요.</b></div>`; return; }
      const compared = state.compare.includes(uni.code);
      $("detail").innerHTML = `
        <div class="detail-head">
          <div>
            <h2>${esc(uni.name)}</h2>
            <div class="detail-sub">
              <span class="badge">${esc(uni.region || "-")}</span>
              <span class="badge blue">대학코드 ${codeLabel(uni.code)}</span>
              <span class="badge teal">학생부종합 모집 ${esc(uni.recruitment || "-")}명</span>
              <span class="badge ${statusClass(uni.status)}">${esc(uni.status)}</span>
            </div>
          </div>
          <button class="btn ${compared ? "warn" : "teal"}" id="detailCompare" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
            ${compared ? "비교 해제" : "비교 선택"}
          </button>
        </div>
        ${uni.hasSection ? detailBody(uni) : `<div class="empty"><b>[면접평가] 구간이 확인되지 않았습니다.</b><span>어디가 응답 원문 기준으로 해당 구간이 없거나 빈 항목입니다.</span></div>`}
      `;
      $("detailCompare").addEventListener("click", () => toggleCompare(uni.code));
    }
    function detailBody(uni){
      const summaries = visibleSummaries(uni);
      const factors = visibleFactors(uni);
      const tables = visibleTables(uni);
      const mainSummary = summaries[0] || {};
      return `
        <div class="section-grid">
          <div class="kpi"><span>면접 상태</span><b>${esc(uni.status)}</b></div>
          <div class="kpi"><span>면접 전형 묶음</span><b>${summaries.length.toLocaleString()}개</b></div>
          <div class="kpi"><span>대표 면접시간</span><b>${esc(mainSummary.time || uni.primaryTime || "-")}</b></div>
          <div class="kpi"><span>평가요소 행</span><b>${factors.length.toLocaleString()}행</b></div>
        </div>
        <div class="block">
          <div class="block-title"><h3>면접평가 요약</h3><span>${summaries.length ? "전형별 정리" : "원문 기준"}</span></div>
          ${summaries.length ? `<div class="interview-list">${summaries.map(summary => summaryHtml(uni, summary)).join("")}</div>` : `<p class="note">${esc(short(uni.sectionText || "면접평가 원문이 비어 있습니다.", 260))}</p>`}
        </div>
        <div class="block">
          <div class="block-title"><h3>평가요소·배점</h3><span>${factors.length ? "자동 추출" : "원문 확인"}</span></div>
          ${factors.length ? factorGroupHtml(factors) : `<p class="note">평가요소와 배점이 정형 표로 분리되지 않았습니다. 면접평가 요약 또는 원문을 확인하세요.</p>`}
        </div>
        <div class="block">
          <div class="block-title"><h3>면접평가 원문 표</h3><span>${tables.length.toLocaleString()}개 표</span></div>
          ${renderTables(tables)}
        </div>
        <details class="fold">
          <summary>원문 구간 보기</summary>
          <div class="fold-body">${esc(uni.sectionText || "원문 텍스트 없음")}</div>
        </details>
        <p class="note">자료 기준: ${esc(DATA.meta.sourceLabel)}. 평가요소 분류와 그래프는 비교 편의를 위한 보조 정보이며, 대학 원문을 우선 기준으로 확인하세요.</p>
      `;
    }
    function summaryHtml(uni, summary){
      const factors = visibleFactors(uni, summary);
      return `<article class="interview-card ${summary.special ? "special" : ""}">
        <div class="interview-title">
          <b>${esc(summary.admission || "공통/원문 기준")}</b>
          ${summary.special ? '<span class="badge warn">특별전형</span>' : ''}
        </div>
        <div class="fact-list">
          <div class="fact"><span>진행방법</span><b>${esc(summary.process || "-")}</b></div>
          <div class="fact"><span>면접시간</span><b>${esc(summary.time || "-")}</b></div>
          <div class="fact"><span>출제방식</span><b>${esc(summary.source || "-")}</b></div>
        </div>
        ${factors.length ? factorStackHtml(factors) : ""}
        ${summary.detail ? `<details class="fold"><summary>평가내용</summary><div class="fold-body">${esc(summary.detail)}</div></details>` : ""}
        ${summary.questions ? `<details class="fold"><summary>면접문항 예시</summary><div class="fold-body">${esc(summary.questions)}</div></details>` : ""}
      </article>`;
    }
    function factorStackHtml(factors){
      const cleaned = factors.filter(f => f.value !== null && f.value !== undefined && Number(f.value) > 0);
      if(!cleaned.length) return "";
      const total = cleaned.reduce((sum,f)=>sum + Number(f.value || 0), 0) || 100;
      const segments = cleaned.map((f,idx) => {
        const w = Math.max(6, Math.round((Number(f.value) / total) * 100));
        const color = colorMap[f.standard] || `var(--bar${(idx % 6) + 1})`;
        return `<span class="seg" style="width:${w}%;background:${color}" title="${esc(f.name)} ${esc(f.raw)}">${esc(f.raw)}</span>`;
      }).join("");
      const legend = cleaned.map((f,idx) => {
        const color = colorMap[f.standard] || `var(--bar${(idx % 6) + 1})`;
        return `<span class="legend-item"><i class="swatch" style="background:${color}"></i>${esc(f.name)} ${esc(f.raw)}</span>`;
      }).join("");
      return `<div class="stack">${segments}</div><div class="legend">${legend}</div>`;
    }
    function factorGroupHtml(factors){
      const grouped = new Map();
      factors.forEach(f => {
        const key = `${f.tableNo}||${f.admission || "공통"}`;
        if(!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(f);
      });
      return `<div class="interview-list">${Array.from(grouped.entries()).map(([key, rows]) => {
        const admission = key.split("||")[1] || "공통";
        return `<article class="interview-card">
          <div class="interview-title"><b>${esc(admission)}</b></div>
          ${factorStackHtml(rows)}
        </article>`;
      }).join("")}</div>`;
    }
    function renderTables(tables){
      if(!tables.length) return `<div class="empty"><b>표 데이터가 없습니다.</b></div>`;
      return tables.map((table, idx) => {
        const rows = table.rows || [];
        if(!rows.length) return "";
        const body = rows.map((row, rIdx) => {
          const tag = rIdx === 0 ? "th" : "td";
          return `<tr class="${row.special ? "special-row" : ""}">${row.cells.map(cell => `<${tag}>${esc(cell)}</${tag}>`).join("")}</tr>`;
        }).join("");
        return `<div class="block">
          <div class="block-title"><h3>원문표 ${idx + 1}</h3><span>표 ${esc(table.tableNo)}</span></div>
          <div class="table-wrap"><table>${body}</table></div>
        </div>`;
      }).join("");
    }
    function toggleCompare(code){
      const index = state.compare.indexOf(code);
      if(index >= 0) state.compare.splice(index, 1);
      else {
        if(state.compare.length >= 3){ toast("비교는 3개 대학까지 가능합니다."); return; }
        state.compare.push(code);
      }
      renderCompare(); renderList(); renderDetail();
    }
    function renderCompare(){
      $("compareCount").textContent = state.compare.length;
      const tags = $("compareTags");
      if(!state.compare.length) tags.innerHTML = `<span class="badge">선택 없음</span>`;
      else tags.innerHTML = state.compare.map(code => {
        const uni = DATA.universities.find(u => u.code === code);
        return `<span class="tag">${esc(uni ? uni.name : code)} <button type="button" data-remove="${esc(code)}" aria-label="비교 제거">×</button></span>`;
      }).join("");
      tags.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => toggleCompare(btn.dataset.remove)));
      const body = $("compareBody");
      if(!state.compare.length){
        body.innerHTML = `<div class="empty"><b>비교 대학이 없습니다.</b><span>대학 목록에서 비교 아이콘을 선택해 주세요.</span></div>`;
        return;
      }
      const cards = state.compare.map(code => DATA.universities.find(u => u.code === code)).filter(Boolean).map(compareCard).join("");
      body.innerHTML = `<div class="compare-grid">${cards}</div>`;
    }
    function compareCard(uni){
      const summaries = visibleSummaries(uni);
      const summary = summaries[0] || {};
      const factors = visibleFactors(uni, summary);
      const factorRows = factors.length ? factors.slice(0, 5).map(f => {
        const total = factors.reduce((sum,item)=>sum + Number(item.value || 0), 0) || 100;
        const w = f.value ? Math.max(6, Math.round((Number(f.value) / total) * 100)) : 6;
        return `<div class="factor-row">
          <span>${esc(f.name)}</span>
          <span class="mini-bar"><i style="width:${w}%;background:${colorMap[f.standard] || '#0f766e'}"></i></span>
          <b>${esc(f.raw)}</b>
        </div>`;
      }).join("") : `<p class="note">평가요소 자동 추출 없음</p>`;
      return `<article class="compare-card">
        <h3>${esc(uni.name)}</h3>
        <div class="detail-sub">
          <span class="badge">${esc(uni.region || "-")}</span>
          <span class="badge ${statusClass(uni.status)}">${esc(uni.status)}</span>
          <span class="badge blue">${esc(short(summary.time || uni.primaryTime || "-", 24))}</span>
        </div>
        <p class="note"><b>진행방법</b> ${esc(summary.process || uni.primaryProcess || "-")}</p>
        <p class="note"><b>출제방식</b> ${esc(summary.source || uni.primarySource || "-")}</p>
        <div class="factor-list">${factorRows}</div>
      </article>`;
    }
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
