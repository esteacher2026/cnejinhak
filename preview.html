  <title>고등학생 내신 학습 방법 통합 안내</title>
  <meta name="description" content="2022 개정 교육과정 기반 고등학생 내신 학습 방법 통합 안내. 국어, 수학, 영어, 사회, 과학 과목별 자료를 한 파일에서 선택해 활용할 수 있습니다." />
  <style>
    :root{
      --bg:#f5f7fb; --paper:#ffffff; --ink:#172033; --muted:#667085; --line:#e2e8f0;
      --brand:#234a7c; --brand2:#0f766e; --accent:#b7791f; --soft:#eef5ff;
      --shadow:0 16px 42px rgba(15,34,64,.10); --radius:22px;
    }
    .floating-home {
position: fixed;      /* 화면에 고정 (스크롤해도 안 따라감) */
bottom: 30px;         /* 아래에서 30px */
right: 30px;          /* 오른쪽에서 30px */
background-color: #1b2430;
color: #ffffff;
padding: 14px 28px;
border-radius: 50px;
text-decoration: none;
font-size: 15px;
font-weight: 700;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
z-index: 9999;        /* 다른 요소 위에 표시 */
transition: transform 0.2s ease;
}
.floating-home:hover {
transform: translateY(-3px);  /* 마우스 올리면 살짝 위로 */
}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef5ff 0%,#f7f8fb 420px);word-break:keep-all;line-height:1.65}
    .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
    header{padding:44px 0 24px;border-bottom:1px solid rgba(35,74,124,.12)}
    .eyebrow{font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand2);margin-bottom:10px}
    h1{font-size:clamp(2.05rem,4.5vw,3.9rem);line-height:1.08;letter-spacing:-.05em;margin:0 0 14px}
    .intro{max-width:860px;color:var(--muted);font-size:1.06rem;margin:0}
    .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .credit{font-size:.78rem;color:#667085;border:1px solid var(--line);background:rgba(255,255,255,.72);padding:7px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 22px rgba(15,34,64,.04)}
    .selector{padding:24px 0 18px}
    .selector-title{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
    .selector-title h2{font-size:1.18rem;margin:0;letter-spacing:-.02em}
    .selector-title p{margin:0;color:var(--muted);font-size:.92rem}
    .subject-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
    .subject-card{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:20px;padding:18px 16px;text-align:left;cursor:pointer;box-shadow:0 10px 28px rgba(15,34,64,.06);transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;color:var(--ink);min-height:132px;position:relative;overflow:hidden}
    .subject-card::after{content:"";position:absolute;right:-28px;top:-28px;width:80px;height:80px;border-radius:50%;background:rgba(35,74,124,.07);transition:transform .16s ease}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(15,34,64,.12);border-color:#b8c6d9}
    .subject-card.active{background:linear-gradient(145deg,#234a7c 0%,#1e5b87 100%);color:#fff;border-color:#234a7c;box-shadow:0 20px 48px rgba(35,74,124,.25)}
    .subject-card.active::after{background:rgba(255,255,255,.13);transform:scale(1.15)}
    .subject-name{display:block;font-size:1.45rem;font-weight:900;letter-spacing:-.04em;margin-bottom:8px;position:relative;z-index:1}
    .subject-desc{display:block;font-size:.88rem;color:var(--muted);line-height:1.52;position:relative;z-index:1}
    .subject-card.active .subject-desc{color:rgba(255,255,255,.82)}
    .viewer-shell{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:36px}
    .viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border-bottom:1px solid var(--line)}
    .viewer-label{font-weight:800;color:#344054;display:flex;align-items:center;gap:8px}
    .viewer-dot{width:9px;height:9px;border-radius:99px;background:var(--brand2);display:inline-block}
    .viewer-actions{display:flex;gap:8px;align-items:center}
    button.small{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;font-size:.86rem;color:#344054;cursor:pointer}
    button.small:hover{background:#f8fafc}
    iframe{width:100%;border:0;display:block;background:white;min-height:1200px}
    .loading{padding:60px 24px;text-align:center;color:var(--muted)}
    footer{border-top:1px solid var(--line);padding:20px 0 36px;color:#667085;font-size:.82rem;text-align:center}
    @media (max-width:980px){.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.subject-card{min-height:118px}}
    @media (max-width:560px){.wrap{padding:0 16px}header{padding-top:34px}.subject-grid{grid-template-columns:1fr}.viewer-bar{align-items:flex-start;flex-direction:column}.credit{white-space:normal}}
    @media print{.selector,.viewer-bar,footer{display:none}body{background:#fff}.wrap{max-width:none;padding:0}.viewer-shell{box-shadow:none;border:0}iframe{min-height:100vh}}
  </style>

    const frame = document.getElementById('contentFrame');
    const grid = document.getElementById('subjectGrid');
    const loading = document.getElementById('loading');
    const viewerTitle = document.getElementById('viewerTitle');
    let current = 'korean';

    function decodePage(b64) {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    }
    function buildCards() {
      grid.innerHTML = SUBJECTS.map(s => `
        <button type="button" class="subject-card ${s.id === current ? 'active' : ''}" data-subject="${s.id}" aria-pressed="${s.id === current ? 'true' : 'false'}">
          <span class="subject-name">${s.name}</span>
          <span class="subject-desc">${s.desc}</span>
        </button>`).join('');
      grid.querySelectorAll('.subject-card').forEach(btn => btn.addEventListener('click', () => selectSubject(btn.dataset.subject, true)));
    }
    function selectSubject(id, updateHash=false) {
      current = id;
      const subject = SUBJECTS.find(s => s.id === id) || SUBJECTS[0];
      viewerTitle.textContent = `${subject.name} 내신 학습 방법`;
      grid.querySelectorAll('.subject-card').forEach(btn => {
        const active = btn.dataset.subject === id;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      loading.style.display = 'block';
      frame.style.display = 'none';
      frame.srcdoc = decodePage(PAGE_DATA[id]);
      if(updateHash) history.replaceState(null, '', '#' + id);
    }
    function resizeFrame() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 1200);
        frame.style.height = (h + 40) + 'px';
        loading.style.display = 'none';
        frame.style.display = 'block';
      } catch(e) {
        loading.style.display = 'none';
        frame.style.display = 'block';
        frame.style.height = '2400px';
      }
    }
    frame.addEventListener('load', () => {
      resizeFrame();
      setTimeout(resizeFrame, 250);
      setTimeout(resizeFrame, 900);
    });
    window.addEventListener('resize', () => setTimeout(resizeFrame, 100));
    function scrollToTopOfViewer() {
      document.querySelector('.viewer-shell').scrollIntoView({behavior:'smooth', block:'start'});
      try { frame.contentWindow.scrollTo(0,0); } catch(e) {}
    }
    function printCurrent() {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch(e) { window.print(); }
    }
    buildCards();
    const fromHash = location.hash.replace('#','');
    if(PAGE_DATA[fromHash]) current = fromHash;
    buildCards();
    selectSubject(current, false);
  </script>
